<div class="default-style">
  <div class="demo-container">
    <dx-speech-to-text
      (onResult)="handleResult($event)"
      (onError)="handleError($event)"
      [speechRecognitionConfig]="speechRecognitionConfig"
    ></dx-speech-to-text>
    <dx-text-area
      [height]="160"
      [width]="320"
      placeholder="Transcribed text will appear here..."
      [(value)]="textAreaValue"
    ></dx-text-area>
  </div>
</div>
